services:
  elabftw-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: elabftw-mcp:local
    container_name: elabftw-mcp
    ports:
      - "${MCP_PUBLISH_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # Ensure the process listens on all interfaces inside the container
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8080"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
