# Open WebUI pointed at an OpenAI-compatible CSIC/SIU-style Qwen gateway.
# Secrets come from .env (see .env.example). Do not hardcode keys here.
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: csic-qwen-open-webui
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    environment:
      OPENAI_API_BASE_URL: "${OPENAI_API_BASE_URL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      WEBUI_AUTH: "${WEBUI_AUTH:-false}"
      ENABLE_OLLAMA_API: "false"
      DEFAULT_MODELS: "${OPENAI_API_MODEL:-}"
      # Avoid first-boot hangs when HuggingFace / embedding downloads are blocked or slow
      OFFLINE_MODE: "true"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      RAG_EMBEDDING_ENGINE: ""
      ENABLE_RAG_HYBRID_SEARCH: "false"
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - open-webui-data:/app/backend/data
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  open-webui-data:
